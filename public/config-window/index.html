<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to Keyboard Configuration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
    <script defer src="main.js"></script>
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <h1 class="mb-4">Configuration</h1>

                <form id="configForm">
                    <div class="mb-4">
                        <label for="languageSelect" class="form-label fw-bold">Transcription Language</label>
                        <select id="languageSelect" class="form-select" required>
                            <option value="">Select a language...</option>
                        </select>
                        <small class="text-muted d-block mt-2">Choose the language for speech recognition</small>
                    </div>

                    <div class="mb-4">
                        <label for="modelSelect" class="form-label fw-bold">Transcription Model</label>
                        <select id="modelSelect" class="form-select" required>
                            <option value="">Select a model...</option>
                        </select>
                        <small class="text-muted d-block mt-2">Larger models are more accurate but slower. Smaller
                            models are faster but less accurate.</small>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Configuration</button>
                        <button type="button" id="resetBtn" class="btn btn-secondary">Reset to Defaults</button>
                    </div>
                </form>

                <div id="successMessage" class="alert alert-success mt-3" role="alert" hidden>
                    Configuration saved successfully!
                </div>

                <div id="errorMessage" class="alert alert-danger mt-3" role="alert" hidden>
                    <span id="errorText"></span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
