<!DOCTYPE html>
<html>

<head>
	<!-- Document encoding and viewport settings for responsive design -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transcription History</title>
	<!-- Bootstrap CSS for styling -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<!-- Main JavaScript file for interactivity -->
	<script defer src="main.js"></script>
</head>

<body class="overflow-hidden">
	<!-- Full-height container with no padding -->
	<div class="container-fluid vh-100 p-0">
		<!-- Two-column layout: sidebar + main content -->
		<div class="row g-0 h-100">

			<!-- Sidebar: History list (25% width) -->
			<aside class="col-3 border-end d-flex flex-column overflow-hidden mh-100">
				<div
					class="flex-shrink-0 px-3 py-2 border-bottom text-uppercase text-muted fw-bold small d-flex justify-content-between align-items-center">
					<span>History</span>
					<button id="clearBtn" type="button" class="btn btn-outline-danger btn-sm py-0 px-1" style="font-size: 0.7rem;">Clear</button>
				</div>
				<!-- Scrollable list of transcription entries -->
				<ul id="historyList" class="list-group list-group-flush overflow-y-auto flex-fill mb-0">
				</ul>
			</aside>

			<!-- Main content area: details view (75% width) -->
			<main class="col-9 d-flex flex-column bg-light overflow-hidden">
				<!-- Empty state: shown when no transcription is selected -->
				<div id="detailEmpty"
					class="flex-fill d-flex align-items-center justify-content-center text-muted">
					Select a transcription to view its content.
				</div>
				<!-- Content view: shown when a transcription is selected -->
				<div id="detailContent" class="d-flex flex-column flex-fill p-4 overflow-hidden" hidden>
					<!-- Timestamp of the transcription -->
					<div id="entryTime" class="text-muted small mb-3"></div>
					<!-- Scrollable transcribed text -->
					<div id="entryText"
						class="flex-fill overflow-y-auto p-3 border rounded bg-white lh-lg">
					</div>
					<!-- Action buttons -->
					<div class="mt-3">
						<button id="copyBtn" type="button" class="btn btn-primary btn-sm">Copy
							Text</button>
					</div>
				</div>
			</main>

		</div>
	</div>
</body>

</html>
