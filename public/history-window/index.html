<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script defer src="main.js"></script>
</head>

<body class="overflow-hidden">
    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">

            <aside class="col-3 border-end d-flex flex-column">
                <div class="flex-shrink-0 px-3 py-2 border-bottom text-uppercase text-muted fw-bold small">History</div>
                <ul id="historyList" class="list-group list-group-flush overflow-y-auto flex-fill mb-0"></ul>
            </aside>

            <main class="col-9 d-flex flex-column bg-light overflow-hidden">
                <div id="detailEmpty" class="flex-fill d-flex align-items-center justify-content-center text-muted">
                    Select a transcription to view its content.
                </div>
                <div id="detailContent" class="d-flex flex-column flex-fill p-4 overflow-hidden" hidden>
                    <div id="entryTime" class="text-muted small mb-3"></div>
                    <div id="entryText" class="flex-fill overflow-y-auto p-3 border rounded bg-white lh-lg"></div>
                    <div class="mt-3">
                        <button id="copyBtn" type="button" class="btn btn-primary btn-sm">Copy Text</button>
                    </div>
                </div>
            </main>

        </div>
    </div>
</body>

</html>
