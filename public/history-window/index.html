<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transcription History</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="main.css">
	<script defer src="main.js"></script>
</head>

<body class="overflow-hidden">
	<div class="d-flex vh-100">

		<aside class="sidebar d-flex flex-column border-end bg-white">
			<div class="sidebar-header px-3 py-2 border-bottom text-uppercase text-muted fw-bold">History
			</div>
			<ul id="historyList" class="list-group list-group-flush overflow-y-auto flex-fill mb-0"></ul>
		</aside>

		<main class="d-flex flex-column flex-fill overflow-hidden bg-light">
			<div id="detailEmpty"
				class="flex-fill d-flex align-items-center justify-content-center text-muted">
				Select a transcription to view its content.
			</div>
			<div id="detailContent" class="d-flex flex-column flex-fill p-4 overflow-hidden" hidden>
				<div id="entryTime" class="text-muted small mb-3"></div>
				<div id="entryText" class="flex-fill overflow-y-auto p-3 border rounded bg-white lh-lg">
				</div>
				<div class="mt-3">
					<button id="copyBtn" type="button" class="btn btn-primary btn-sm">Copy
						Text</button>
				</div>
			</div>
		</main>

	</div>
</body>

</html>
