<!DOCTYPE html>
<html>

    <link rel="stylesheet" href="main.css">
    <script src="main.js"></script>
</head>

        <h1>Voice to Keyboard</h1>

            <button id="closeBtn">Close</button>
        </div>
    </div>

</html>
