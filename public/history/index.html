<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription History</title>
    <link rel="stylesheet" href="main.css">
    <script defer src="main.js"></script>
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">History</div>
            <ul id="historyList"></ul>
        </aside>
        <main class="detail">
            <div class="detail-empty" id="detailEmpty">Select a transcription to view its content.</div>
            <div class="detail-content" id="detailContent" hidden>
                <div class="detail-meta" id="entryTime"></div>
                <div class="detail-text" id="entryText"></div>
                <div class="actions">
                    <button id="copyBtn" type="button">Copy Text</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
