<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcription History</title>
    <link rel="stylesheet" href="main.css">
    <script defer src="main.js"></script>
</head>

<body>
    <div class="container">
        <h1>Transcription History</h1>
        <p class="subtitle">Select a past transcription from the dropdown menu.</p>

        <div class="controls">
            <label for="historySelect">History entries</label>
            <select id="historySelect"></select>
        </div>

        <div class="meta" id="entryTime">No entry selected</div>
        <div class="text-box" id="entryText"></div>

        <div class="actions">
            <button id="copyBtn" type="button">Copy Selected Text</button>
        </div>
    </div>
</body>

</html>
